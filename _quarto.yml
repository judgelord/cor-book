execute:
  cache: true
  freeze: false # once the results are locked in, turn this on so that we don't need to re-render - it does require rendering each chapter seperatly as we update them
  echo: false
  message: false
  warning: false

project:
  type: book
  output-dir: docs
  render:
    - "!interbranch.qmd" # ! = things to not render
    - "!code/**"
    - "!replication*"
    - "!archive/"
    - "!feedback/"
    - "!README"

book:
  title: "Interbranch Representation"
  subtitle: "How congressional offices work with the bureaucracy"
  author: "Devin Judge-Lord, Eleanor Powell, Rochelle Snyder"
  date: today
  cover-image: assets/cover.png
  chapters:
     - index.md
 #    - preface.md
     - acknowledgements.md
     - ch1-intro.qmd
     - ch2-causes.qmd
     - ch3-effects.qmd
     - ch4-data.qmd
     - ch5-results-demand.qmd
     - ch6-results-capacity.qmd
     - ch7-results-incentives.qmd
#     - ch8-results-overall.qmd. #TODO merge this into conclusion
     - ch8-conclusion.qmd
     - references.md
  appendices:
     - appendix-a-methods.qmd
     - appendix-b-data.qmd
     - appendix-c-models.qmd
     - appendix-d-types-across-models.qmd
     - appendix-e-alt-models.qmd
     - appendix-f-correlations.qmd
  search: true
  #repo-url: https://github.com/judgelord/cor-book
  downloads: pdf # [pdf, epub]

number-depth: 2

language:
  crossref-thm-title: "Hypothesis"
  crossref-thm-prefix: "Hypothesis"
bibliography: assets/cor.bib

filters:
  - assets/hypotheses.lua
  - quarto
  - assets/rowlines.lua

rowlines:
  - tbl-demand
  - tbl-demand-findings
  - tbl-capacity
  - tbl-capacity-findings
  - tbl-strategy
  - tbl-strategy-findings

hypotheses:
  - id: demand
    subs: [number, empowered, need]
  - id: capacity
    subs: [experience, staff, position, reporting]
  - id: strategy
    subs:
      - id: partisan
        subs:
          - {id: alignment, label: "alignment"}
          - {id: antagonism, label: "antagonism"}
          - {id: coalition, label: "business"}
          - {id: antigovernment, label: "anti-government"}
      - id: electoral
        subs:
          - {id: competition, label: "competition"}
          - {id: donors, label: "donors"}
          - {id: distraction, label: "distraction"}
      - institutional
      - staff

format:
  html:
    self-contained: false # why does this make the files so large? (77MB!)
    css: styles.css
    fig-cap-location: top
    tbl-cap-location: top
    include-after-body:
      - assets/hypothesis-numbering-overide.html
  pdf:
    toc: true
    lof: true
    lot: true
    number-depth: 2
    include-in-header:
       - assets/header.tex
    keep-tex: true
    fig-cap-location: top
    tbl-cap-location: top
    #pdf-engine: pdflatex. # pdflatex is faster, but perhaps not as good as lulatex

    # include-after-body:
    #   text: |
    #     \printindex
  # epub:
  #    cover-image: assets/cover.png

book-content: true # we are not really using this and could delete this after removing all of the book content chunk fences
