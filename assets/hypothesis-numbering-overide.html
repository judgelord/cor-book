<script>
document.addEventListener("DOMContentLoaded", async function () {
  /*
    Quarto theorem-like prefixes.
    If you only want ordinary theorems, keep only:
      const theoremKinds = { thm: "Theorem" };
  */
  const theoremKinds = {
    thm: "Hypothesis",
    exm: "Example",
  };

  /*
    true  = Theorem 1, Theorem 2, Lemma 1, Lemma 2, ...
    false = Theorem 1, Lemma 2, Theorem 3, Definition 4, ...
  */
  const separateCountersByKind = true;

  const prefixes = Object.keys(theoremKinds);
  const theoremSelector = prefixes
    .map(prefix => `div[id^="${prefix}-"]`)
    .join(",");

  function getPrefix(id) {
    return prefixes.find(prefix => id.startsWith(prefix + "-"));
  }

  function pageUrlsFromSidebar() {
    const links = Array.from(
      document.querySelectorAll(
        "#quarto-sidebar a[href], .sidebar-navigation a[href], nav.sidebar a[href]"
      )
    );

    const urls = [];

    for (const link of links) {
      const url = new URL(link.getAttribute("href"), window.location.href);

      if (url.origin !== window.location.origin) continue;

      url.hash = "";

      if (!urls.some(existing => existing.href === url.href)) {
        urls.push(url);
      }
    }

    if (urls.length === 0) {
      const current = new URL(window.location.href);
      current.hash = "";
      urls.push(current);
    }

    return urls;
  }

  async function getDocumentForUrl(url) {
    const current = new URL(window.location.href);
    current.hash = "";

    if (url.href === current.href) {
      return document;
    }

    const response = await fetch(url.href, { credentials: "same-origin" });
    const html = await response.text();

    return new DOMParser().parseFromString(html, "text/html");
  }

  const counters = {};
  const numberMap = {};

  const urls = pageUrlsFromSidebar();

  for (const url of urls) {
    let doc;

    try {
      doc = await getDocumentForUrl(url);
    } catch {
      continue;
    }

    const blocks = Array.from(doc.querySelectorAll(theoremSelector));

    for (const block of blocks) {
      const id = block.getAttribute("id");
      const prefix = getPrefix(id);

      if (!prefix) continue;

      const counterKey = separateCountersByKind ? prefix : "__all__";

      counters[counterKey] = (counters[counterKey] || 0) + 1;

      numberMap[id] = {
        label: theoremKinds[prefix],
        number: counters[counterKey]
      };
    }
  }

  const labelsPattern = Object.values(theoremKinds).join("|");
  const oldNumberPattern = new RegExp(
    `\\b(${labelsPattern})\\s+\\d+(?:\\.\\d+)*`
  );

  function updateTheoremBlock(block) {
    const id = block.getAttribute("id");
    const info = numberMap[id];

    if (!info) return;

    const title =
      block.querySelector(".theorem-title strong") ||
      block.querySelector(".theorem-title");

    if (!title) return;

    title.textContent = title.textContent.replace(
      oldNumberPattern,
      `${info.label} ${info.number}`
    );
  }

  function updateTheoremReference(link) {
    if (!link.hash) return;

    const id = decodeURIComponent(link.hash.substring(1));
    const info = numberMap[id];

    if (!info) return;

    link.textContent = link.textContent.replace(
      oldNumberPattern,
      `${info.label} ${info.number}`
    );
  }

  document
    .querySelectorAll(theoremSelector)
    .forEach(updateTheoremBlock);

  document
    .querySelectorAll("a[href*='#']")
    .forEach(updateTheoremReference);
});
</script>
